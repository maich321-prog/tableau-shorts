name: Tableau de bord

on:
  workflow_dispatch:  # lancé par horloge.yml à chaque h00 / h30

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les librairies
        run: pip install google-api-python-client google-auth

      - name: Ecrire les tokens (secrets)
        env:
          TOKEN_MALIK: ${{ secrets.TOKEN_MALIK }}
          TOKEN_JACE: ${{ secrets.TOKEN_JACE }}
          TOKEN_KAI: ${{ secrets.TOKEN_KAI }}
          TOKEN_VILLES: ${{ secrets.TOKEN_VILLES }}
          TOKEN_EXPLICATIONS: ${{ secrets.TOKEN_EXPLICATIONS }}
          TOKEN_GORILLES: ${{ secrets.TOKEN_GORILLES }}
          TOKEN_CLIPPING: ${{ secrets.TOKEN_CLIPPING }}
        run: |
          mkdir -p automatisation/tokens
          printf '%s' "$TOKEN_MALIK"  > automatisation/tokens/token-malik.json
          printf '%s' "$TOKEN_JACE"   > automatisation/tokens/token-jace.json
          printf '%s' "$TOKEN_KAI"    > automatisation/tokens/token-kai.json
          printf '%s' "$TOKEN_VILLES" > automatisation/tokens/token-villes.json
          [ -n "$TOKEN_EXPLICATIONS" ] && printf '%s' "$TOKEN_EXPLICATIONS" > automatisation/tokens/token-explications.json || true
          [ -n "$TOKEN_GORILLES" ] && printf '%s' "$TOKEN_GORILLES" > automatisation/tokens/token-gorilles.json || true
          [ -n "$TOKEN_CLIPPING" ] && printf '%s' "$TOKEN_CLIPPING" > automatisation/tokens/token-clipping.json || true

      - name: Fabriquer la page
        run: |
          mkdir -p site
          python automatisation/stats.py --out site/index.html
          cp automatisation/icones/* site/

      - name: Garder l'historique (graphiques d'evolution)
        run: |
          git config user.name "tableau-bot"
          git config user.email "tableau-bot@users.noreply.github.com"
          git add automatisation/historique.json
          git commit -m "Historique $(date -u +%FT%H:%MZ)" || exit 0
          git pull --rebase -q || true
          git push -q

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
